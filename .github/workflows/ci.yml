name: CI (de-forge governance)

# Two independent jobs, both blocking, neither substituting for the other:
#   gate-self-tests -> proves the gates would still catch a real violation (D-12/F3).
#   gates           -> actually runs them against THIS repo's real files.
# A framework that only ran the second would be exactly what the owner's original G5 gates
# were: unproven. A framework that only ran the first would prove nothing about the actual
# repo. Adapted from the owner's G5 canon + the trailofbits/skills self-test doctrine
# (RESEARCH_nasrul-crosscheck.md).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate-self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: pip install pyyaml
      - name: Prove every gate still catches what it exists to catch
        run: |
          set -e
          for g in journey_completeness boundary_contract doc_reference_contract secrets_scan incident_hygiene claim_ledger; do
            echo "--- $g ---"
            python "gates/$g.py" --self-test
          done

  gates:
    needs: gate-self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: pip install pyyaml
      - name: Journey completeness gate
        run: python gates/journey_completeness.py
      - name: Boundary contract gate
        run: python gates/boundary_contract.py
      - name: Doc-reference contract gate
        run: python gates/doc_reference_contract.py
      - name: Secrets scan gate
        run: python gates/secrets_scan.py
      - name: Incident hygiene gate
        run: python gates/incident_hygiene.py
      - name: Claim ledger gate
        run: python gates/claim_ledger.py
      # Uncomment once this project has a dbt project / Great Expectations suite (D-10):
      # - name: dbt parse
      #   run: cd <dbt_project_dir> && dbt deps && dbt parse
      # - name: Great Expectations checkpoint
      #   run: great_expectations checkpoint run <checkpoint_name>

  # Unit tests — separate from gates: a test failure and a gate failure are independent
  # signals, both blocking, neither substituting for the other (same doctrine as G5's ci.yml).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; else echo "no tests/ yet"; fi
